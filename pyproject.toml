[project]
name = "lora-morph"
version = "0.1.0"
description = "Framework-agnostic LoRA implementation from scratch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_morph"]