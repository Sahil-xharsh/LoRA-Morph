[project]
name = "lora-morph"
version = "0.1.0"
description = "Framework-agnostic LoRA implementation from scratch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "numpy",
    "peft>=0.21.0",
    "torch",
    "torchvision>=0.29.0",
    "transformers>=4.40,<5",
]

[project.optional-dependencies]
hf = [
    "huggingface-hub>=0.36.2",
    "safetensors>=0.4",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_morph"]

[tool.pytest.ini_options]
pythonpath = ["."]
